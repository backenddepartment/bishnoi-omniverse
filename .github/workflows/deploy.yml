name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-progress run finish instead of
# cancelling it, so the site never ends up mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reads this repo's Pages settings to figure out the base path
      # (e.g. "/bishnoi-omniverse", or "" for a username.github.io root page).
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # GITHUB_PAGES=true switches next.config.ts into static export mode.
      # GitHub Pages only serves static files, so our locale middleware
      # (src/proxy.ts) can't run there — Next.js disables it automatically
      # during export, and src/app/page.tsx redirects "/" to the default
      # locale client-side instead.
      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
