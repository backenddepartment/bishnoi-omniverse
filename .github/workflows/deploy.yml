name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  # Picks up Google Sheet edits without anyone touching the repo. The site is a static export,
  # so the catalog only changes when it is rebuilt — see docs/catalog-sheet.md.
  schedule:
    - cron: "0 * * * *" # hourly, on the hour (UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci || npm install

      # Rewrites lib/data/catalogData.json from the sheet. With the secret unset this is a
      # no-op and the committed JSON is used, so the build still works on a fork. If the sheet
      # is unreachable or has invalid rows the step fails and the previous deploy stays live.
      - name: Sync catalog from Google Sheet
        env:
          CATALOG_SHEET_CSV: ${{ secrets.CATALOG_SHEET_CSV }}
        run: npm run catalog:sync

      - name: Build static Next.js export
        env:
          NEXT_PUBLIC_BASE_PATH: "/bishnoi-omniverse"
          GITHUB_ACTIONS: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx next build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
